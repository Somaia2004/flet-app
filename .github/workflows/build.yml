name: Build Flet Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.x"
          channel: "stable"

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          python -m pip install flet==0.86.5

      - name: Prepare App Icon
        run: |
          mkdir -p assets
          cp icon.PNG assets/icon.png

      - name: Build APK
        run: |
          flet build apk --yes \
            --product "أذكار الصباح و المساء"

      - name: Build AAB
        run: |
          flet build aab --yes \
            --product "أذكار الصباح و المساء"

      - name: Find APK and AAB
        run: |
          echo "Searching for APK and AAB files..."
          find . -type f \( -name "*.apk" -o -name "*.aab" \) -print

      - name: Verify APK and AAB
        run: |
          APK_COUNT=$(find . -type f -name "*.apk" | wc -l)
          AAB_COUNT=$(find . -type f -name "*.aab" | wc -l)

          echo "APK files found: $APK_COUNT"
          echo "AAB files found: $AAB_COUNT"

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK file was generated."
            exit 1
          fi

          if [ "$AAB_COUNT" -eq 0 ]; then
            echo "ERROR: No AAB file was generated."
            exit 1
          fi

          echo "APK and AAB were generated successfully."

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: azkar-android
          path: |
            **/*.apk
            **/*.aab
          if-no-files-found: error
